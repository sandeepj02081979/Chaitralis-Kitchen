name: Build menu.json from menu.xlsx

on:
  push:
    branches: [main]
    paths:
      - "data/menu.xlsx"
      - "scripts/build_menu.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install openpyxl
      - run: python3 scripts/build_menu.py
      - name: Commit menu.json if changed
        run: |
          git config user.name "menu-bot"
          git config user.email "actions@github.com"
          git add data/menu.json
          git diff --cached --quiet || git commit -m "Auto-build menu.json from menu.xlsx"
          git push
